<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80" role="img" aria-label="Achievements" font-family="ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <rect x="0.5" y="0.5" width="479" height="79" rx="10" fill="#0d1117" stroke="#30363d"/>
  <text x="20" y="24" font-size="13" font-weight="700" fill="#39d353">Achievements</text>
  <g transform="translate(20, 36)">
    <!-- Pull Shark -->
    <rect x="0" y="0" width="102" height="30" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="10" y="19" font-size="14">🦈</text>
    <text x="32" y="19" font-size="11" font-weight="600" fill="#e6edf3">Pull Shark</text>

    <!-- Quickdraw -->
    <rect x="110" y="0" width="98" height="30" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="120" y="19" font-size="14">⚡</text>
    <text x="142" y="19" font-size="11" font-weight="600" fill="#e6edf3">Quickdraw</text>

    <!-- Pair Extraordinaire -->
    <rect x="216" y="0" width="128" height="30" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="226" y="19" font-size="14">👯</text>
    <text x="248" y="19" font-size="11" font-weight="600" fill="#e6edf3">Pair Extraordinaire</text>

    <!-- Arctic Code Vault -->
    <rect x="352" y="0" width="108" height="30" rx="6" fill="#161b22" stroke="#21262d"/>
    <text x="362" y="19" font-size="14">❄️</text>
    <text x="384" y="19" font-size="11" font-weight="600" fill="#e6edf3">Code Vault</text>
  </g>
</svg>